# Server Configuration
#server.port=8080
server.port=${PORT:8080}
spring.application.name=tms-backend

# running on localhost
#spring.datasource.url=jdbc:postgresql://localhost:5432/tmsdb
#spring.datasource.username=postgres
#spring.datasource.password=password

# PostgreSQL (Railway) - Use DATABASE_URL directly
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql
spring.graphql.schema.printer.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=86400000

# Logging (reduce for production)
logging.level.org.springframework.security=INFO
logging.level.com.tms=INFO
logging.level.org.hibernate.SQL=INFO

# CORS Configuration - ADD YOUR VERCEL URL HERE
#cors.allowed.origins=http://localhost:5173,http://localhost:3000
cors.allowed.origins=tms-fullstack-production.up.railway.app,http://localhost:5173