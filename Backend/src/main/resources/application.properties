# Server Configuration
server.port=${PORT:8080}
spring.application.name=tms-backend

# PostgreSQL (Railway) - Use DATABASE_URL directly
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql
spring.graphql.schema.printer.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=86400000

# Logging (reduce for production)
logging.level.org.springframework.security=INFO
logging.level.com.tms=INFO
logging.level.org.hibernate.SQL=INFO

# CORS Configuration - ADD YOUR VERCEL URL HERE
cors.allowed.origins=https://your-vercel-app.vercel.app,http://localhost:5173