# Server Configuration
#server.port=8080

#For deployment
server.port=${PORT:8080}
spring.application.name=tms-backend

# Database Configuration (H2 for development)
#spring.datasource.url=jdbc:h2:mem:tmsdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# PostgreSQL Configuration (uncomment for production)
#spring.datasource.url=jdbc:postgresql://localhost:5432/tmsdb
#spring.datasource.username=postgres
#pring.datasource.password=password

# for deployment PostgreSQL
spring.datasource.url=${jdbc:postgresql://localhost:5432/tmsdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For PostgreSQL use: org.hibernate.dialect.PostgreSQLDialect

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql
spring.graphql.schema.printer.enabled=true

# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.tms=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# CORS Configuration
cors.allowed.origins=http://localhost:5173,http://localhost:3000